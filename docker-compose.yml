services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # For local dev, only run `db` (docker compose up -d db) and use
  # `npm run dev` on the host for hot reload. This `app` service is for
  # prod/Coolify parity (it's what Coolify actually builds and runs).
  # No Traefik/proxy labels here — Coolify manages its own reverse
  # proxy/TLS for docker-compose resources via its UI.
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    restart: unless-stopped

volumes:
  pgdata:
